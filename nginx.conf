server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain;

    # Docker's embedded DNS. Used with a variable in proxy_pass below so
    # nginx resolves "api" lazily, per-request, instead of once at startup -
    # a literal hostname in proxy_pass is resolved eagerly at config load,
    # and if the api container isn't up yet at that exact moment nginx
    # refuses to start at all (taking the whole site down, not just the
    # quote tool). With a variable, nginx starts regardless and individual
    # proxied requests just 502 until the api container is reachable.
    # ipv6=off: Docker's embedded DNS doesn't expect AAAA queries for
    # container names, which was producing "unexpected DNS response" and
    # 502s on every request even though the api container was fine.
    resolver 127.0.0.11 valid=10s ipv6=off;
    # DNS resolution has its own separate timeout (default 30s) that neither
    # proxy_connect_timeout nor proxy_read_timeout cover - without this, a
    # slow/hanging lookup could outlast the frontend's own abort timeout and
    # get reported as a generic "no response" instead of nginx's real error.
    resolver_timeout 5s;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # More specific than /quote/ below, so nginx picks this one first for API
    # calls (longest-prefix match wins regardless of file order). No trailing
    # path on proxy_pass, so the full request URI is forwarded unchanged -
    # the api service's routes are defined to match /quote/api/... exactly.
    location ^~ /quote/api/ {
        auth_basic "Roc Technologies internal";
        auth_basic_user_file /etc/nginx/auth/htpasswd;
        # Trailing dot fully-qualifies the name so nginx's resolver doesn't
        # apply the container's search-domain suffix (logs showed it
        # querying "api.mynet" instead of plain "api" and failing on that).
        set $api_upstream "http://api.:3001";
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Fail fast if the api container is down/unreachable rather than
        # hanging on nginx's 60s defaults - a stuck spinner is worse than a
        # quick, clear error the frontend can show.
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
    }

    # ^~ forces this prefix to win over the regex asset-caching location below,
    # so quote.js/quote.css (which embed the internal rate card) stay behind auth too.
    location ^~ /quote/ {
        auth_basic "Roc Technologies internal";
        auth_basic_user_file /etc/nginx/auth/htpasswd;
        try_files $uri $uri/ /quote/index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
