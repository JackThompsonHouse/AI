server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # More specific than /psquote/ below, so nginx picks this one first for
    # API calls (longest-prefix match wins regardless of file order). No
    # trailing path on proxy_pass, so the full request URI is forwarded
    # unchanged - the api service's routes are defined to match
    # /psquote/api/... exactly.
    location ^~ /psquote/api/ {
        auth_basic "Roc Technologies internal";
        auth_basic_user_file /etc/nginx/auth/htpasswd;
        # Plain static hostname, resolved once via the container's normal
        # system resolver (Docker's embedded DNS) at nginx startup - the
        # standard, well-supported way Compose services find each other.
        # Safe against the api container not being ready yet because web's
        # depends_on in docker-compose.yml now waits for api's healthcheck
        # before web even starts, and restart:unless-stopped covers the
        # rest if that ordering is ever imperfect. (An nginx-internal
        # "resolver" directive was tried here instead, to resolve lazily
        # per-request - but it turned out to have its own DNS bug in this
        # environment: it kept querying "api.mynet", a search-domain
        # expansion neither a trailing dot nor ipv6=off fixed. Simpler is
        # more reliable here.)
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
    }

    # ^~ forces this prefix to win over the regex asset-caching location below,
    # so quote.js/quote.css (which embed the internal rate card) stay behind auth too.
    location ^~ /psquote/ {
        auth_basic "Roc Technologies internal";
        auth_basic_user_file /etc/nginx/auth/htpasswd;
        try_files $uri $uri/ /psquote/index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
